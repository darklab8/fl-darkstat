name: Build darkstat static assets
description: ""
inputs:
  freelancer-folder:
    description: Path to root of freelancer directory
    default: ${{ github.workspace }}
    # type: string
runs:
  using: "composite"
  steps:
    - name: Install latest darkstat
      uses: darklab8/fl-darkstat/.github/actions/install-latest@master
    - name: validate
      shell: bash
      run: darkstat --map-on --stat-deals-on validate error
      env:
        CONFIGS_FREELANCER_FOLDER: ${{ inputs.freelancer-folder }}
