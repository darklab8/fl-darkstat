name: Build darkstat static assets
description: ""
inputs:
  freelancer-folder:
    description: Path to root of freelancer directory
    default: ${{ github.workspace }}
    # type: string
  site-host:
    description: Site host
    # type: string
    default: ""
  site-root:
    description: Site root prefix to static assets
    # type: string
    default: "/"
  heading:
    description: Heading at the site rigit.
    # type: string
    default: 'fl-darkstat powered by <a
      href="https://github.com/darklab8/fl-darkstat">Github</a>'
  relay-host:
    description: turning of optional dark relay features. necessary only for Discovery
    default: "http://localhost:8080"
  command:
    description: Command to run for darkstat
    default: "--stat-deals-on build"
  map-index-url:
    description: Map index url
    default: "index.html"
  map-on:
    description: turn on map by separate method
    default: "false"
  disable-dev-mode:
    description: dev mode of darkmap infocards leave on or off
  map-by-url:
    description: turn on map by separate method
    default: "map.html"

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: darklab8/fl-darkstat/.github/actions/install-latest@master
    - name: build
      if: ${{ inputs.map-on != 'true' }}
      shell: bash
      run: darkstat ${{ inputs.command }}
      env:
        DARKSTAT_SITE_HOST: ${{ inputs.site-host }}
        DARKSTAT_SITE_ROOT: ${{ inputs.site-root }}
        DARKMAP_SITE_ROOT: ${{ inputs.site-root }}
        CONFIGS_FREELANCER_FOLDER: ${{ inputs.freelancer-folder }}
        DARKSTAT_FLDARKSTAT_HEADING: ${{ inputs.heading }}
        DARKSTAT_RELAY_HOST: ${{ inputs.relay-host }}
        UTILS_DEV_ENV: "true"
        DARKMAP_INDEX_URL: "${{ inputs.map-index-url }}"
        DARKMAP_STAT_AT_ROOT_ON: "true"
        DISABLE_DEV_MODE: "${{ inputs.disable-dev-mode }}"
    - name: build
      if: ${{ inputs.map-on == 'true' }}
      shell: bash
      run: darkstat ${{ inputs.command }}
      env:
        DARKSTAT_SITE_HOST: ${{ inputs.site-host }}
        DARKSTAT_SITE_ROOT: ${{ inputs.site-root }}
        DARKMAP_SITE_ROOT: ${{ inputs.site-root }}
        CONFIGS_FREELANCER_FOLDER: ${{ inputs.freelancer-folder }}
        DARKSTAT_FLDARKSTAT_HEADING: ${{ inputs.heading }}
        DARKSTAT_RELAY_HOST: ${{ inputs.relay-host }}
        UTILS_DEV_ENV: "true"
        DARKMAP_INDEX_URL: "${{ inputs.map-index-url }}"
        DARKSTAT_MAP_BY_URL: ${{ inputs.map-by-url }}
        DISABLE_DEV_MODE: "${{ inputs.disable-dev-mode }}"
    - name: build
      shell: bash
      run: darkstat map build
      if: ${{ inputs.map-on == 'true' }}
      env:
        DARKSTAT_SITE_HOST: ${{ inputs.site-host }}
        DARKSTAT_SITE_ROOT: ${{ inputs.site-root }}
        DARKMAP_SITE_ROOT: ${{ inputs.site-root }}
        CONFIGS_FREELANCER_FOLDER: ${{ inputs.freelancer-folder }}
        DARKSTAT_FLDARKSTAT_HEADING: ${{ inputs.heading }}
        DARKSTAT_RELAY_HOST: ${{ inputs.relay-host }}
        UTILS_DEV_ENV: "true"
        DARKMAP_INDEX_URL: "${{ inputs.map-index-url }}"
        DARKCORE_BUILD_FOLDER: build_map
        DARKMAP_STAT_AT_ROOT_ON: "true"
        DISABLE_DEV_MODE: "${{ inputs.disable-dev-mode }}"
    - name: collect nap files
      shell: bash
      if: ${{ inputs.map-on == 'true' }}
      run: cp -r build_map/* build/
